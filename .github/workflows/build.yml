name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner already ships an Android SDK; just make sure licenses are accepted.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Finds the project wherever it was uploaded (repo root or a subfolder).
      - name: Build debug APK
        run: |
          SETTINGS=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts not found in the repository. Files present:"
            find . -not -path "./.git/*" -type f | head -n 50
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          echo "Building in $(pwd)"
          gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: downtime-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
